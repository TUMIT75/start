    <path d="M 45 208 C 43 203, 40 197, 33 197 C 27 197, 23 201, 23 206 C 23 213, 31 216, 41 221 C 51 226, 56 232, 56 242 C 56 253, 46 259, 34 259 C 22 259, 14 251, 12 242 L 20 239 C 22 247, 27 252, 34 252 C 41 252, 47 248, 47 241 C 47 235, 41 231, 30 225 C 20 220, 14 215, 14 205 C 14 195, 23 189, 34 189 C 43 189, 50 195, 52 203 L 45 208 Z"/>
    
