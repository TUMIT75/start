  <text x="150" y="280" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="18" font-weight="600" fill="#D1D5DB" text-anchor="middle" letter-spacing="1">
