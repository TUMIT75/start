    <!-- A (Chevron style, no crossbar, distinct apex) -->
    <path d="M 148 190 L 157 190 L 180 257 L 170 257 L 152 204 L 135 257 L 125 257 L 148 190 Z"/>
    
    <!-- R -->
    <path d="M 200 191 L 222 191 C 233 191, 241 198, 241 209 C 241 217, 235 224, 226 226 L 243 257 L 233 257 L 217 228 L 208 228 L 208 257 L 200 257 L 200 191 Z M 208 198 L 208 221 L 221 221 C 228 221, 232 217, 232 210 C 232 203, 228 198, 221 198 L 208 198 Z"/>
    
